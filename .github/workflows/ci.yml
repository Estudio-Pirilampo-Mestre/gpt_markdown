name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned so a new LTS never lands on a push that changed nothing.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format, analyze, test
        run: ./scripts/check.sh

  score:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub.dev score
        # 160 is a perfect score. Anything less is a regression: a missing
        # dartdoc, a stale dependency, a packaging mistake.
        run: ./scripts/score.sh 160
