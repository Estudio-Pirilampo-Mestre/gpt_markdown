name: Feature request
description: New syntax, a new option, or a change in behaviour.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Many customisations need no change to the package. Before opening,
        check whether a style or builder already covers it: see
        [customization](https://github.com/useval/gpt_markdown/blob/main/docs/customization.md)
        and [API options](https://github.com/useval/gpt_markdown/blob/main/docs/api-options.md).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who runs into it, and when. A real example helps most.
    validations:
      required: true

  - type: textarea
    id: markdown
    attributes:
      label: Example Markdown
      description: If this is about syntax or rendering, the input you want supported.
      render: markdown

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The behaviour, and if you have one in mind, the API.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: >-
        Workarounds or existing options you considered — a `styleSheet` field,
        a builder, an `InlinePattern` — and why they fall short.

  - type: checkboxes
    id: checks
    attributes:
      label: Before opening
      options:
        - label: I searched open issues and pull requests for a duplicate.
          required: true
